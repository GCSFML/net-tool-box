name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build (web)
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o nettoolbox${{ matrix.ext }} .

      - name: Build (CLI/TUI)
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o nettoolbox-cli${{ matrix.ext }} ./cmd/nettui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nettoolbox-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            nettoolbox${{ matrix.ext }}
            nettoolbox-cli${{ matrix.ext }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 三个平台都会产出同名的 nettoolbox / nettoolbox-cli，
      # 直接上传会互相覆盖（Linux 和 macOS 尤其危险），所以按平台重命名。
      - name: Flatten and rename assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in artifacts/*/; do
            name=$(basename "$dir")        # 例如 nettoolbox-linux-amd64
            plat=${name#nettoolbox-}       # 例如 linux-amd64
            for f in "$dir"*; do
              base=$(basename "$f")
              if [[ "$base" == *.exe ]]; then
                cp "$f" "out/${base%.exe}-${plat}.exe"
              else
                cp "$f" "out/${base}-${plat}"
              fi
            done
          done
          echo "发布产物："
          ls -l out

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
